<section class="portadas-section">
    <h2 class="portadas-title">Lo que tenemos para vos!</h2>
    
    <!-- Portada 1 -->
    <div class="portada-item portada-blanca">
        <div class="portada-video reel-container">
            <!-- Video nativo para control total. Reemplaza el src con tu archivo descargado -->
            <video muted loop playsinline preload="none" class="video-reel" width="100%" height="100%">
                <!-- Archivo en la raíz del proyecto: portada1.mp4 -->
                <source src="../video.mp4/portada1.mp4" type="video/mp4">
                Tu navegador no soporta videos HTML5.
            </video>
            <!-- Botón para activar/desactivar audio -->
            <button class="sound-toggle" aria-label="Activar sonido">
                <i class="fa-solid fa-volume-xmark"></i>
            </button>
        </div>
        <div class="portada-info">
            <span class="tagline">Streetwear Evolution</span>
            <h3>Establece tu estilo</h3>
            <p>No es solo ropa, es una declaración. Fusionamos la rebeldía urbana con cortes de alta gama para que destaques en cada esquina. Viste la actitud que te define.</p>
            <button class="btn-portada" onclick="document.getElementById('productos-container').scrollIntoView({behavior: 'smooth'})">Ver Colección</button>
        </div>
    </div>
</section>
