<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - UrbanHustler</title>

    <!-- Estilos Globales y Componentes -->
    <link rel="stylesheet" href="../CSS/index.css">
    <link rel="stylesheet" href="../CSS/footer.css">
    <link rel="stylesheet" href="../CSS/productos.css"> <!-- Reutilizamos estilos de cards -->

    <!-- Estilos Específicos del Catálogo -->
    <link rel="stylesheet" href="../CSS/catalogo.css">
    <link rel="stylesheet" href="../CSS/filters.css">
    <link rel="stylesheet" href="../CSS/intermedio.css">
    <link rel="stylesheet" href="../CSS/chatbot.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="catalog-page">

    <div id="navbar-container"></div>

    <!-- Nuevo Carrusel del Catálogo -->
    <div id="catalog-carousel-container"></div>

    <main class="catalog-layout">
        <!-- Aquí se inyectarán los componentes -->
        <div id="filters-container"></div> <!-- Menú lateral / Hamburguesa -->

        <div class="catalog-grid-wrapper">
            <div id="catalog-grid" class="products-grid"></div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="../JavaScript/navbar.js"></script> <!-- Para cargar nav/footer -->
    <script src="../JavaScript/data.js"></script> <!-- Datos compartidos -->
    <script src="../JavaScript/mvc.js"></script> <!-- Arquitectura (Model, View, Controller) -->
    <script src="../JavaScript/cart.js"></script> <!-- Ruta correcta: sale de HTML y entra a JavaScript -->
    <script src="../JavaScript/catalogo.js"></script> <!-- Lógica principal -->
    <script src="../JavaScript/chatbot.js"></script>
</body>

</html>
