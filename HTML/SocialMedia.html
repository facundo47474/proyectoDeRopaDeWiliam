<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Section – Urban Hustler</title>
  <link rel="stylesheet" href="/CSS/social.css" />
  <!-- Font Awesome para el ícono de Instagram -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- ====== SECCIÓN INSTAGRAM ====== -->
  <section class="ig-section">

    <!-- Encabezado -->
    <div class="ig-header">
      <div class="ig-logo-wrap">
        <i class="fa-brands fa-instagram ig-icon"></i>
      </div>
      <div class="ig-header-text">
        <p class="ig-handle">@urbanhustler_indumentaria</p>
        <h2 class="ig-title">Seguinos en Instagram</h2>
        <p class="ig-subtitle">Outfits, novedades y descuentos exclusivos para nuestra comunidad 🔥</p>
      </div>
      <a
        class="ig-btn"
        href="https://www.instagram.com/urbanhustler_indumentaria"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-brands fa-instagram"></i> Seguir
      </a>
    </div>

    <!-- Grilla de fotos -->
    <div class="ig-grid" id="igGrid">
      <!-- 9 posts placeholder; reemplazá los src con URLs reales o imágenes locales -->
      <a class="ig-item" href="https://www.instagram.com/urbanhustler_indumentaria" target="_blank">
        <img src="/img.jpeg/Post1.jpeg" alt="Post Instagram 1" loading="lazy" />
        <div class="ig-overlay"><i class="fa-brands fa-instagram"></i></div>
      </a>
      <a class="ig-item" href="https://www.instagram.com/urbanhustler_indumentaria" target="_blank">
        <img src="/img.jpeg/Post2.jpeg" alt="Post Instagram 2" loading="lazy" />

      </a>
      <a class="ig-item" href="https://www.instagram.com/urbanhustler_indumentaria" target="_blank">
        <img src="/img.jpeg/Post3.jpeg" alt="Post Instagram 3" loading="lazy" />
        <div class="ig-overlay"><i class="fa-brands fa-instagram"></i></div>
      </a>
      <a class="ig-item" href="https://www.instagram.com/urbanhustler_indumentaria" target="_blank">
        <img src="/img.jpeg/Post4.jpeg" alt="Post Instagram 4" loading="lazy" />
        <div class="ig-overlay"><i class="fa-brands fa-instagram"></i></div>
      </a>
      <a class="ig-item" href="https://www.instagram.com/urbanhustler_indumentaria" target="_blank">
        <img src="/img.jpeg/Post5.jpeg" alt="Post Instagram 5" loading="lazy" />
        <div class="ig-overlay"><i class="fa-brands fa-instagram"></i></div>
      </a>
      <a class="ig-item" href="https://www.instagram.com/urbanhustler_indumentaria" target="_blank">
        <img src="/img.jpeg/Post6.jpeg" alt="Post Instagram 6" loading="lazy" />
        <div class="ig-overlay"><i class="fa-brands fa-instagram"></i></div>
      </a>
      <a class="ig-item ig-hide-mobile" href="https://www.instagram.com/urbanhustler_indumentaria" target="_blank">
        <img src="/img.jpeg/pantalon 1.jpeg" alt="Post Instagram 7" loading="lazy" />
        <div class="ig-overlay"><i class="fa-brands fa-instagram"></i></div>
      </a>
      <a class="ig-item ig-hide-mobile" href="https://www.instagram.com/urbanhustler_indumentaria" target="_blank">
        <img src="/img.jpeg/pantalon 2.jpeg" alt="Post Instagram 8" loading="lazy" />
        <div class="ig-overlay"><i class="fa-brands fa-instagram"></i></div>

        <img src="/img.jpeg/2.jpeg" alt="Post Instagram 9" loading="lazy" />
        <div class="ig-overlay"><i class="fa-brands fa-instagram"></i></div>
      </a>
    </div>

    <!-- CTA footer -->
    <div class="ig-footer">
      <a
        class="ig-btn ig-btn-outline"
        href="https://www.instagram.com/urbanhustler_indumentaria"
        target="_blank"
        rel="noopener noreferrer"
      >
        Ver todos los posts <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>

  </section>
  <!-- ====== FIN SECCIÓN INSTAGRAM ====== -->

  <script src="/JavaScript/social.js"></script>
</body>
</html>
