<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | UrbanHustler AI</title>
    <!-- Estilos Globales -->
    <link rel="stylesheet" href="../CSS/index.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #050505;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .control-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .control-header h1 {
            font-size: 3rem;
            text-transform: uppercase;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .control-header p {
            color: #888;
            font-size: 1.2rem;
            margin-bottom: 3rem;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1000px;
        }
        .dashboard-card {
            background: #111;
            border: 1px solid #222;
            padding: 2rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .dashboard-card:hover {
            border-color: #D90429;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(217, 4, 41, 0.1);
        }
        .dashboard-card i {
            font-size: 2.5rem;
            color: #D90429;
        }
        .dashboard-card h3 {
            font-size: 1.2rem;
            text-transform: uppercase;
        }
        .back-btn {
            margin-top: 3rem;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .back-btn:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="control-container">
        <div class="control-header">
            <h1>Centro de Comando</h1>
            <p>Bienvenido al núcleo de UrbanHustler AI</p>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-card">
                <i class="fa-solid fa-chart-line"></i>
                <h3>Métricas</h3>
                <p style="color:#666; font-size:0.9rem;">Ver estadísticas de ventas</p>
            </div>
            <div class="dashboard-card">
                <i class="fa-solid fa-users"></i>
                <h3>Usuarios</h3>
                <p style="color:#666; font-size:0.9rem;">Gestionar clientes</p>
            </div>
            <div class="dashboard-card">
                <i class="fa-solid fa-box-open"></i>
                <h3>Inventario</h3>
                <p style="color:#666; font-size:0.9rem;">Control de stock</p>
            </div>
            <div class="dashboard-card">
                <i class="fa-solid fa-robot"></i>
                <h3>Configurar IA</h3>
                <p style="color:#666; font-size:0.9rem;">Ajustar respuestas</p>
            </div>
        </div>

        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Volver al sitio principal</a>
    </div>
</body>
</html>
